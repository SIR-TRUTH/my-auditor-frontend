<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#182234" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg3)" rx="16" />
  
  <!-- Isometric Cube Box Graphic -->
  <g transform="translate(800, 180)">
    <path d="M 100 0 L 220 60 L 100 120 L -20 60 Z" fill="#182234" stroke="#0D9488" stroke-width="3" />
    <path d="M -20 60 V 180 L 100 240 V 120 Z" fill="#111827" stroke="#1F293B" stroke-width="3" />
    <path d="M 220 60 V 180 L 100 240 V 120 Z" fill="#0E1522" stroke="#1F293B" stroke-width="3" />
  </g>

  <!-- Content Block -->
  <text x="80" y="220" fill="#14B8A6" font-family="sans-serif" font-weight="bold" font-size="18" letter-spacing="2">ENTERPRISE INVENTORY</text>
  <text x="80" y="280" fill="#F9FAFB" font-family="sans-serif" font-weight="extrabold" font-size="42">Weighted Average Cost (WAC)</text>
  <text x="80" y="330" fill="#9CA3AF" font-family="sans-serif" font-size="18">Consolidated stock valuation and branch-level inventory control across Nigeria & beyond.</text>
</svg>